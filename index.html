<!-- Import JavaScript Supabase Direct Integration via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabaseClient = null;
        let nextOrderNumber = 101;

        // Gunakan DOMContentLoaded supaya script berjalan dengan lebih pantas
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('sb_url');
            const savedKey = localStorage.getItem('sb_key');
            if (savedUrl && savedKey) {
                document.getElementById('sb-url').value = savedUrl;
                document.getElementById('sb-key').value = savedKey;
                initSupabase(savedUrl, savedKey);
            }
            generateNextNumber();

            // SINKRONISASI TAB TERUS APABILA PAGE DIBUKA
            checkAndApplyTab();
        });

        // Kesan sekiranya URL hash bertukar secara langsung
        window.addEventListener('hashchange', () => {
            checkAndApplyTab();
        });

        function checkAndApplyTab() {
            const currentHash = window.location.hash.replace('#', '');
            const savedTab = currentHash || localStorage.getItem('active_tab') || 'kasir';
            switchTab(savedTab);
        }

        function saveConfig() {
            const url = document.getElementById('sb-url').value.trim();
            const key = document.getElementById('sb-key').value.trim();
            if(!url || !key) return alert('Sila isi kedua-dua URL dan Key');
            
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            initSupabase(url, key);
        }

        function initSupabase(url, key) {
            supabaseClient = supabase.createClient(url, key);
            document.getElementById('config-screen').classList.add('hidden');
            
            fetchOrders();
            subscribeRealtime();
        }

        function generateNextNumber() {
            document.getElementById('order-input').value = 'A-' + nextOrderNumber;
        }

        function switchTab(tab) {
            localStorage.setItem('active_tab', tab);
            
            // ELAKKAN INFINITE LOOP HASH
            if (window.location.hash !== '#' + tab) {
                window.location.hash = tab;
            }

            const kasirTab = document.getElementById('tab-kasir');
            const displayTab = document.getElementById('tab-display');
            const btnKasir = document.getElementById('btn-kasir');
            const btnDisplay = document.getElementById('btn-display');

            if (tab === 'display') {
                kasirTab.classList.add('hidden');
                displayTab.classList.remove('hidden');
                btnDisplay.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition";
                btnKasir.className = "px-4 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
            } else {
                kasirTab.classList.remove('hidden');
                displayTab.classList.add('hidden');
                btnKasir.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition";
                btnDisplay.className = "px-4 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
            }
        }

        async function createOrder() {
            if(!supabaseClient) return;
            const orderNum = document.getElementById('order-input').value;
            
            const { data, error } = await supabaseClient
                .from('orders')
                .insert([{ order_number: orderNum, status: 'preparing' }]);

            if (error) {
                alert('Gagal simpan: ' + error.message);
            } else {
                nextOrderNumber++;
                generateNextNumber();
                fetchOrders();
            }
        }

        async function fetchOrders() {
            if(!supabaseClient) return;
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .in('status', ['preparing', 'ready'])
                .order('created_at', { ascending: true });

            if (error) return console.error(error);
            renderTables(orders);
        }

        async function updateStatus(id, newStatus) {
            if(!supabaseClient) return;
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) alert('Gagal kemaskini status');
            fetchOrders();
        }

        function subscribeRealtime() {
            supabaseClient
                .channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                    fetchOrders();
                })
                .subscribe();
        }

        function renderTables(orders) {
            const tableBody = document.getElementById('admin-table-body');
            const prepDisplay = document.getElementById('display-preparing');
            const readyDisplay = document.getElementById('display-ready');

            tableBody.innerHTML = '';
            prepDisplay.innerHTML = '';
            readyDisplay.innerHTML = '';

            if (orders.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">Tiada pesanan aktif waktu ini.</td></tr>`;
            }

            orders.forEach(order => {
                const time = new Date(order.created_at).toLocaleTimeString('ms-MY', {hour: '2-digit', minute:'2-digit'});
                
                let actionButton = '';
                if(order.status === 'preparing') {
                    actionButton = `<button onclick="updateStatus(${order.id}, 'ready')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-xs transition">🔔 Siap / Panggil</button>`;
                } else if(order.status === 'ready') {
                    actionButton = `<button onclick="updateStatus(${order.id}, 'completed')" class="bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-xs transition">✓ Selesai Ambil</button>`;
                }

                const statusBadge = order.status === 'preparing' 
                    ? `<span class="px-2 py-1 rounded-md text-xs font-medium bg-amber-100 text-amber-800">Sedang Disiap</span>`
                    : `<span class="px-2 py-1 rounded-md text-xs font-medium bg-emerald-100 text-emerald-800">Sedia Dikutip</span>`;

                tableBody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3 font-bold text-slate-900">${order.order_number}</td>
                        <td class="p-3 text-slate-500">${time}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-right">${actionButton}</td>
                    </tr>
                `;

                if(order.status === 'preparing') {
                    prepDisplay.innerHTML += `
                        <div class="bg-white text-slate-800 px-6 py-4 rounded-2xl shadow-xs border border-amber-200 text-2xl font-black tracking-wider min-w-[100px] text-center">
                            ${order.order_number}
                        </div>
                    `;
                } else if(order.status === 'ready') {
                    readyDisplay.innerHTML += `
                        <div class="bg-emerald-600 text-white px-6 py-4 rounded-2xl shadow-md text-2xl font-black tracking-wider min-w-[100px] text-center pulse-ready border-2 border-emerald-400">
                            ${order.order_number}
                        </div>
                    `;
                }
            });
        }
    </script>
