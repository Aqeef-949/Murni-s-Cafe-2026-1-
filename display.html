<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickup Display TV - Murni's Cafe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #334155;
            margin-bottom: 24px;
        }
        h1 {
            color: #60a5fa;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-tag {
            background-color: #1e293b;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #334155;
        }
        .container {
            display: flex;
            gap: 24px;
            flex: 1;
        }
        .box {
            flex: 1;
            background-color: #1e293b;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .box-prep { border: 2px solid rgba(245, 158, 11, 0.4); }
        .box-ready { border: 2px solid rgba(16, 185, 129, 0.4); }
        
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 24px;
            border-bottom: 4px solid;
        }
        .header-prep { border-color: #f59e0b; color: #fbbf24; }
        .header-ready { border-color: #10b981; color: #34d399; }
        
        .box-title { font-size: 28px; font-weight: 900; text-transform: uppercase; }
        .badge-prep { background-color: rgba(245, 158, 11, 0.2); color: #fef08a; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge-ready { background-color: rgba(16, 185, 129, 0.2); color: #a7f3d0; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }

        .grid-list {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-content: flex-start;
            flex: 1;
        }
        .card-prep {
            background-color: #334155;
            color: #fef08a;
            font-size: 42px;
            font-weight: 900;
            padding: 18px 32px;
            border-radius: 16px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            text-align: center;
            min-width: 140px;
        }
        .card-ready {
            background-color: #059669;
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            padding: 18px 32px;
            border-radius: 16px;
            border: 2px solid #a7f3d0;
            text-align: center;
            min-width: 140px;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 PAPARAN ANTREAN PESANAN</h1>
        <div class="status-tag" id="connection-status">🔄 Menyambung...</div>
    </header>

    <div class="container">
        <!-- Sedang Disiapkan (Preparing) -->
        <div class="box box-prep">
            <div class="box-header header-prep">
                <div class="box-title">👨‍🍳 Sedang Disiapkan</div>
                <div class="badge-prep">PREPARING</div>
            </div>
            <div id="display-preparing" class="grid-list">
                <!-- Nombor giliran akan keluar automatik di sini -->
            </div>
        </div>

        <!-- Siap Sedia (Ready) -->
        <div class="box box-ready">
            <div class="box-header header-ready">
                <div class="box-title">🔔 Sila Ambil Pesanan</div>
                <div class="badge-ready">READY</div>
            </div>
            <div id="display-ready" class="grid-list">
                <!-- Nombor giliran akan keluar automatik di sini -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // =========================================================================
        // SILA MASUKKAN MAKLUMAT SUPABASE ANDA DI 2 BARIS INI:
        // =========================================================================
        var SUPABASE_URL = "https://rjgpbrczlgqovmystohy.supabase.co";
        var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqZ3BicmN6bGdxb3ZteXN0b2h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNTY5ODQsImV4cCI6MjEwNTYzMjk4NH0.0f1YfRLoJCideuSRd9jm3iURUvtnvuLZvx0N6JWsc7w";
        // =========================================================================

        var supabaseClient = null;

        window.onload = function() {
            var url = (SUPABASE_URL && !SUPABASE_URL.includes("MASUKKAN_")) ? SUPABASE_URL : localStorage.getItem('sb_url');
            var key = (SUPABASE_KEY && !SUPABASE_KEY.includes("MASUKKAN_")) ? SUPABASE_KEY : localStorage.getItem('sb_key');

            if (url && key) {
                initSupabase(url, key);
            } else {
                document.getElementById('connection-status').innerText = '❌ Sila masukkan URL/Key Supabase dalam kod';
                document.getElementById('connection-status').style.color = '#f87171';
            }
        };

        function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                document.getElementById('connection-status').innerText = '🟢 Bersambung';
                document.getElementById('connection-status').style.color = '#34d399';
                
                fetchOrders();
                subscribeRealtime();
            } catch(e) {
                document.getElementById('connection-status').innerText = '❌ Ralat Sambungan';
                document.getElementById('connection-status').style.color = '#f87171';
            }
        }

        async function fetchOrders() {
            if(!supabaseClient) return;
            var res = await supabaseClient
                .from('orders')
                .select('*')
                .in('status', ['preparing', 'ready'])
                .order('created_at', { ascending: true });

            if (res.data) {
                renderDisplay(res.data);
            }
        }

        function subscribeRealtime() {
            if(!supabaseClient) return;
            supabaseClient
                .channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, function() {
                    fetchOrders();
                })
                .subscribe();
        }

        function renderDisplay(orders) {
            var prepDisplay = document.getElementById('display-preparing');
            var readyDisplay = document.getElementById('display-ready');

            prepDisplay.innerHTML = '';
            readyDisplay.innerHTML = '';

            orders.forEach(function(order) {
                if(order.status === 'preparing') {
                    prepDisplay.innerHTML += '<div class="card-prep">' + order.order_number + '</div>';
                } else if(order.status === 'ready') {
                    readyDisplay.innerHTML += '<div class="card-ready">' + order.order_number + '</div>';
                }
            });
        }
    </script>
</body>
</html>
